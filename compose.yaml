name: fatorx-global-intelligence

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: fatorx_test
      POSTGRES_USER: fatorx
      POSTGRES_PASSWORD: test
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatorx -d fatorx_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - fatorx_postgresql_data:/var/lib/postgresql

volumes:
  fatorx_postgresql_data:
    name: fatorx_global_intelligence_postgresql_data
